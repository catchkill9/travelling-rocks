<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travelling Rocks 🪨🌍</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <link rel="stylesheet" href="style.css?v=21">
</head>
<body>
  <header>
    <a href="#home" class="logo">🪨 Travelling Rocks</a>
    <nav>
      <a href="#home" data-t="nav_home">Home</a>
      <a href="#rocks" data-t="nav_rocks">Find a Rock</a>
      <a href="#found" data-t="nav_found">I Found a Rock!</a>
      <a href="#rules" data-t="nav_rules">Rules</a>
      <a href="#class" data-t="nav_add">Add a Rock</a>
      <select id="lang" class="lang" aria-label="Language" onchange="setLang(this.value)"></select>
    </nav>
  </header>

  <main id="app"></main>

  <footer data-t="footer">🪨 Painted rocks travelling the world, one hiding place at a time 🌍</footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="i18n.js?v=21"></script>
  <script>document.getElementById("lang").innerHTML = Object.keys(LANGS).map(k => `<option value="${k}">${LANGS[k].flag} ${LANGS[k].name}</option>`).join("");</script>
  <script src="app.js?v=21"></script>
</body>
</html>
